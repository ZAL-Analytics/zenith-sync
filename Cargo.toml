[package]
name = "zenith-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Arsalan Anwari"]
description = "A Git-inspired, read-only sync tool that mirrors network shares to local systems. Fast, immutable, and secure data streaming."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/ZAL-Analytics/zenith-sync"
homepage = "https://github.com/ZAL-Analytics/zenith-sync"
documentation = "https://docs.rs/zenith-sync"
keywords = ["sync", "mirror", "network-share", "backup", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "zenith_sync"
path = "src/lib.rs"

[[bin]]
name = "zenith-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
smb = { version = "=0.12.1", default-features = false, features = ["async", "sign", "encrypt"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi"] }

[dev-dependencies]
tempfile = "3.27.0"
